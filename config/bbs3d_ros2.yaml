# bbs3d_ros2 runtime configuration.
#
# `target_clouds` MUST be an absolute path to a directory containing your
# map .pcd file(s). Edit the value below, or pass a different yaml via:
#   ros2 launch bbs3d_ros2 bbs3d_rviz2.launch.py config_file:=/abs/path/to/your.yaml
#
# Schema mirrors upstream 3d_bbs/ros2_test/config/ros2_test.yaml.

################[Necessary]################
## Folder paths
target_clouds: "/path/to/target"  # <-- replace with your absolute path

## topic name
lidar_topic_name: "/livox/points" ## msg type: sensor_msgs/PointCloud2
imu_topic_name: "/livox/imu" ## msg type: sensor_msgs/Imu

## 3D-BBS parameters
min_level_res: 1.0 # [m], e.g. outdoor: 1.0, indoor: 0.5
max_level: 6

## Angular search range [rad]
# 6.28 input is converted to 2*M_PI
min_rpy: [-0.02,-0.02,0.0] # [roll, pitch, yaw]
max_rpy: [0.02,0.02,6.28] # [roll, pitch, yaw]

## Score threshold
# score_threshold = floor(src_points.size() * score_threshold_percentage)
score_threshold_percentage: 0.9

################[Optional]################
## Downsample target clouds [m]
tar_leaf_size: 0.1 # off: 0.0

## Downsample source clouds [m]
src_leaf_size: 2.0 # off: 0.0

## Crop source clouds [m]
min_scan_range: 0.0 # [m]
max_scan_range: 100.0 # [m]
# off: set 0.0 to both min_scan_range and max_scan_range

## Timeout [msec]
# Enter the number as int
timeout_msec: 0 # off: 0

## 使用する 3D-BBS 実装 (Step 11)
## "auto" : GPU 実装を含むビルドなら GPU、CPU のみのビルドなら CPU(default)
## "gpu"  : 常に GPU。GPU 実装を含まないビルドでは起動時にエラー終了する
## "cpu"  : 常に CPU(GPU 搭載機で CPU と比較したいときなど)
## GPU 実装が含まれるかはビルド時に自動判定される(CUDA と libgpu_bbs3d.so が
## 見つかるか)。CPU は GPU より大幅に遅いため、必要なら timeout_msec や
## src_leaf_size と併せて調整すること。
# backend: "auto"

## Topic / Service names (defaults match upstream ros2_test/rviz2)
## Uncomment and edit to override. Defaults are used when commented out.
# tar_points_topic_name: "/tar_points"
# src_points_on_global_pose_topic_name: "/src_points_on_global_pose"
# global_pose_topic_name: "/global_pose"
# score_topic_name: "/score"
# time_topic_name: "/time"
# localize_topic_name: "~/localize"   # used for both Bool topic and Trigger service

## Target source mode (Step 10)
## "pcd"   : 起動時に target_clouds パスから PCD をロード(上流互換、default)
## "topic" : target_cloud_topic_name を transient_local QoS で subscribe し、
##           受信のたびに voxelmap を再構築(地図ホットスワップ)
# target_source_mode: "pcd"
# target_cloud_topic_name: "/target_cloud"   # topic モードのみ参照

## Target cloud QoS (Step 10 follow-up)
## default は REP-2003 Maps 推奨の "reliable" + "transient_local"。pcl_ros 等
## REP-2003 非準拠の publisher(volatile)と接続する場合は yaml で切替える。
# target_cloud_qos_reliability: "reliable"          # "reliable" | "best_effort"
# target_cloud_qos_durability:  "transient_local"   # "transient_local" | "volatile"
